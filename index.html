<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dichteberechnung Widget</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
    }

    .widget {
        width: 100%;
        max-width: 500px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        padding: 30px;
    }

    h1 {
        margin-top: 0;
        text-align: center;
        color: #1f3b5b;
    }

    .formula {
        background: #eef5ff;
        border-left: 4px solid #3b82f6;
        padding: 15px;
        border-radius: 8px;
        text-align: center;
        font-size: 1.3rem;
        font-weight: bold;
        color: #1e3a8a;
        margin-bottom: 25px;
    }

    .input-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #334155;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 1rem;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }

    .result {
        margin-top: 25px;
        padding: 20px;
        background: #f8fafc;
        border: 1px solid #dbeafe;
        border-radius: 10px;
        display: none;
        text-align: center;
    }

    .value {
        font-size: 2rem;
        font-weight: bold;
        color: #059669;
        margin-top: 10px;
    }

    .error {
        margin-top: 15px;
        padding: 12px;
        background: #fee2e2;
        color: #b91c1c;
        border-radius: 8px;
        display: none;
    }

    .info {
        margin-top: 20px;
        font-size: 0.9rem;
        color: #64748b;
        line-height: 1.6;
    }
</style>
</head>
<body>

<div class="widget">
    <h1>Dichteberechnung</h1>

    <div class="formula">
        ρ = m / V
    </div>

    <div class="input-group">
        <label for="mass">Masse (g)</label>
        <input type="number" id="mass" placeholder="z. B. 1000" step="any">
    </div>

    <div class="input-group">
        <label for="volume">Volumen (cm³ oder mL)</label>
        <input type="number" id="volume" placeholder="z. B. 1000" step="any">
    </div>

    <button onclick="calculateDensity()">Dichte berechnen</button>

    <div class="error" id="error"></div>

    <div class="result" id="result">
        <h2>Ergebnis</h2>
        <div class="value" id="densityValue"></div>
    </div>

    <div class="info">
        <strong>Formel:</strong> Dichte = Masse ÷ Volumen<br>
        <strong>Einheit:</strong> g/cm³<br><br>
        <strong>Beispiel:</strong><br>
        1000 g ÷ 1000 cm³ = 1,00 g/cm³ (Wasser)
    </div>
</div>

<script>
function calculateDensity() {
    const mass = parseFloat(document.getElementById("mass").value);
    const volume = parseFloat(document.getElementById("volume").value);

    const error = document.getElementById("error");
    const result = document.getElementById("result");
    const densityValue = document.getElementById("densityValue");

    error.style.display = "none";
    result.style.display = "none";

    if (isNaN(mass) || isNaN(volume) || mass <= 0 || volume <= 0) {
        error.textContent = "Bitte gültige Werte größer als 0 eingeben.";
        error.style.display = "block";
        return;
    }

    const density = mass / volume;

    densityValue.textContent = density.toFixed(4) + " g/cm³";
    result.style.display = "block";
}
</script>

</body>
</html>
