<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dichteberechnung</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #e3f2fd, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      text-align: center;
      max-width: 500px;
      width: 90%;
    }

    h1 {
      color: #1565c0;
      margin-bottom: 20px;
    }

    .formula {
      font-size: 42px;
      font-weight: bold;
      color: #0d47a1;
      background: #e3f2fd;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 25px;
    }

    .explanation {
      text-align: left;
      font-size: 18px;
      line-height: 1.8;
      color: #333;
    }

    .symbol {
      font-weight: bold;
      color: #1565c0;
    }

    .footer {
      margin-top: 25px;
      font-size: 14px;
      color: gray;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Dichteberechnung</h1>

    <div class="formula">
      ρ = m / V
    </div>

    <div class="explanation">
      <p><span class="symbol">ρ</span> = Dichte</p>
      <p><span class="symbol">m</span> = Masse</p>
      <p><span class="symbol">V</span> = Volumen</p>
    </div>

    <div class="footer">
      Erstellt für GitHub Pages 🚀
    </div>
  </div>

</body>
</html>
