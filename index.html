<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Dichte Simulation</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    #panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      width: 300px;
      padding: 20px;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin-top: 0;
      color: #38bdf8;
    }

    .formula {
      font-size: 28px;
      text-align: center;
      margin: 15px 0;
      color: #7dd3fc;
      font-weight: bold;
    }

    input[type=range] {
      width: 100%;
    }

    .values {
      margin-top: 15px;
      font-size: 18px;
      line-height: 1.7;
    }
  </style>
</head>
<body>

<div id="panel">
  <h1>Dichteberechnung</h1>

  <div class="formula">ρ = m / V</div>

  <label>Masse</label>
  <input type="range" id="massSlider" min="10" max="150" value="50">

  <label style="margin-top:10px; display:block;">Volumen</label>
  <input type="range" id="volumeSlider" min="50" max="200" value="100">

  <div class="values">
    <div>Masse: <span id="mass">50</span> g</div>
    <div>Volumen: <span id="volume">100</span> ml</div>
    <div>Dichte: <span id="density">0.50</span> g/ml</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f172a);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,5,14);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHT
scene.add(new THREE.AmbientLight(0xffffff,0.7));
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(10,15,10);
scene.add(light);

// CONTAINER GROUP
const containerGroup = new THREE.Group();
scene.add(containerGroup);

const glass = new THREE.MeshPhysicalMaterial({
  color:0xffffff, transparent:true, opacity:0.15, transmission:1, roughness:0
});

const boxSize = {x:6,y:8,z:6};

const container = new THREE.Mesh(new THREE.BoxGeometry(boxSize.x,boxSize.y,boxSize.z), glass);
container.position.y = 3;
containerGroup.add(container);

// FLUID
const liquidMat = new THREE.MeshPhysicalMaterial({
  color:0x2563eb, transparent:true, opacity:0.55, roughness:0.2
});
const liquid = new THREE.Mesh(new THREE.BoxGeometry(5.6,4,5.6), liquidMat);
liquid.position.y = 1;
containerGroup.add(liquid);

// PARTICLES
const particles=[];
const geo=new THREE.SphereGeometry(0.12,10,10);

function createParticles(n){
  particles.forEach(p=>scene.remove(p));
  particles.length=0;

  for(let i=0;i<n;i++){
    const m=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x38bdf8,emissiveIntensity:1});
    const p=new THREE.Mesh(geo,m);

    p.position.set((Math.random()-0.5)*5,Math.random()*6,(Math.random()-0.5)*5);
    p.velocity={x:(Math.random()-0.5)*0.03,y:(Math.random()-0.5)*0.03,z:(Math.random()-0.5)*0.03};

    particles.push(p);
    scene.add(p);
  }
}

createParticles(50);

// UI
const massS=document.getElementById("massSlider");
const volS=document.getElementById("volumeSlider");

const massT=document.getElementById("mass");
const volT=document.getElementById("volume");
const densT=document.getElementById("density");

let mass=50;
let volume=100;

function update(){
  const density=mass/volume;

  massT.textContent=mass;
  volT.textContent=volume;
  densT.textContent=density.toFixed(2);

  createParticles(mass);

  const h=Math.min(volume/100,2);
  liquid.scale.y=h;
  liquid.position.y=h*2-1;
}

massS.oninput=()=>{mass=+massS.value;update();};
volS.oninput=()=>{volume=+volS.value;update();};
update();

// MOUSE ROTATION ONLY ON DRAG
let isDown=false,ox=0,oy=0,tx=0,ty=0,rx=0,ry=0;

renderer.domElement.onmousedown=e=>{isDown=true;ox=e.clientX;oy=e.clientY;};
renderer.domElement.onmouseup=()=>isDown=false;
renderer.domElement.onmouseleave=()=>isDown=false;
renderer.domElement.onmousemove=e=>{
  if(!isDown)return;
  tx+=(e.clientX-ox)*0.01;
  ty+=(e.clientY-oy)*0.005;
  ox=e.clientX;oy=e.clientY;
};

// ANIMATE
function animate(){
  requestAnimationFrame(animate);

  rx+=(tx-rx)*0.08;
  ry+=(ty-ry)*0.08;

  containerGroup.rotation.y=rx;
  containerGroup.rotation.x=ry;

  containerGroup.updateMatrixWorld(true);

  const half={x:boxSize.x/2,y:boxSize.y/2,z:boxSize.z/2};

  particles.forEach(p=>{
    p.position.add(new THREE.Vector3(p.velocity.x,p.velocity.y,p.velocity.z));

    const local=p.position.clone();
    containerGroup.worldToLocal(local);

    if(local.x>half.x||local.x<-half.x)p.velocity.x*=-1;
    if(local.y>half.y||local.y<-half.y)p.velocity.y*=-1;
    if(local.z>half.z||local.z<-half.z)p.velocity.z*=-1;
  });

  renderer.render(scene,camera);
}

animate();

window.onresize=()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
};
</script>
</body>
</html>
