<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Dichteberechnung</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #0f172a, #1e293b);
      color: white;
    }

    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 20px;
      width: 300px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
      color: #7dd3fc;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
    }

    input[type="range"] {
      width: 100%;
    }

    .formula {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      color: #38bdf8;
    }

    .values {
      margin-top: 15px;
      line-height: 1.8;
      font-size: 18px;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>

<div id="ui">
  <h1>Dichte 3D Simulation</h1>

  <label for="massSlider">Masse ändern</label>
  <input type="range" id="massSlider" min="1" max="100" value="50" />

  <div class="formula">
    ρ = m / V
  </div>

  <div class="values">
    <div>Masse: <span id="massValue">50</span></div>
    <div>Volumen: <span id="volumeValue">100</span></div>
    <div>Dichte: <span id="densityValue">0.50</span></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

<script>
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f172a);

  const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  camera.position.set(0, 8, 15);

  // Licht
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
  directionalLight.position.set(10, 20, 10);
  scene.add(directionalLight);

  // Boden
  const floorGeometry = new THREE.PlaneGeometry(50, 50);
  const floorMaterial = new THREE.MeshStandardMaterial({
    color: 0x1e293b
  });

  const floor = new THREE.Mesh(floorGeometry, floorMaterial);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.5;
  scene.add(floor);

  // Behälter
  const containerGeometry = new THREE.BoxGeometry(6, 8, 6);
  const containerMaterial = new THREE.MeshPhysicalMaterial({
    color: 0x38bdf8,
    transparent: true,
    opacity: 0.25,
    roughness: 0,
    transmission: 1
  });

  const container = new THREE.Mesh(containerGeometry, containerMaterial);
  container.position.y = 4;
  scene.add(container);

  // Teilchen
  const particles = [];
  const particleGeometry = new THREE.SphereGeometry(0.15, 16, 16);

  function createParticles(count) {
    particles.forEach(p => scene.remove(p));
    particles.length = 0;

    for (let i = 0; i < count; i++) {
      const particleMaterial = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0x38bdf8,
        emissiveIntensity: 1
      });

      const particle = new THREE.Mesh(particleGeometry, particleMaterial);

      particle.position.set(
        (Math.random() - 0.5) * 5,
        Math.random() * 7 + 0.5,
        (Math.random() - 0.5) * 5
      );

      particle.userData.velocity = {
        x: (Math.random() - 0.5) * 0.03,
        y: (Math.random() - 0.5) * 0.03,
        z: (Math.random() - 0.5) * 0.03
      };

      particles.push(particle);
      scene.add(particle);
    }
  }

  createParticles(50);

  // Slider
  const massSlider = document.getElementById('massSlider');
  const massValue = document.getElementById('massValue');
  const densityValue = document.getElementById('densityValue');

  const volume = 100;

  massSlider.addEventListener('input', () => {
    const mass = Number(massSlider.value);
    const density = mass / volume;

    massValue.textContent = mass;
    densityValue.textContent = density.toFixed(2);

    createParticles(mass);
  });

  // Animation
  function animate() {
    requestAnimationFrame(animate);

    particles.forEach(particle => {
      particle.position.x += particle.userData.velocity.x;
      particle.position.y += particle.userData.velocity.y;
      particle.position.z += particle.userData.velocity.z;

      if (particle.position.x > 2.7 || particle.position.x < -2.7) {
        particle.userData.velocity.x *= -1;
      }

      if (particle.position.y > 7.5 || particle.position.y < 0.5) {
        particle.userData.velocity.y *= -1;
      }

      if (particle.position.z > 2.7 || particle.position.z < -2.7) {
        particle.userData.velocity.z *= -1;
      }
    });

    container.rotation.y += 0.002;

    controls.update();
    renderer.render(scene, camera);
  }

  animate();

  // Responsive
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>

</body>
</html>
