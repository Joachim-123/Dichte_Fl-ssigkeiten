<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Dichte Simulation</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    #panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      width: 300px;
      padding: 20px;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }

    h1 {
      margin-top: 0;
      color: #38bdf8;
    }

    .formula {
      font-size: 28px;
      text-align: center;
      margin: 20px 0;
      color: #7dd3fc;
      font-weight: bold;
    }

    input[type=range] {
      width: 100%;
    }

    .values {
      margin-top: 15px;
      line-height: 1.8;
      font-size: 18px;
    }
  </style>
</head>
<body>

<div id="panel">
  <h1>Dichteberechnung</h1>

  <div class="formula">
    ρ = m / V
  </div>

  <label>Masse verändern</label>
  <input type="range" id="massSlider" min="10" max="150" value="50">

  <label style="margin-top:15px; display:block;">Volumen verändern</label>
  <input type="range" id="volumeSlider" min="50" max="200" value="100">

  <div class="values">
    <div>Masse: <span id="mass">50</span></div>
    <div>Volumen: <span id="volume">100</span></div>
    <div>Dichte: <span id="density">0.50</span></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f172a);

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.z = 14;
camera.position.y = 5;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// LICHT
const ambient = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambient);

const light = new THREE.PointLight(0xffffff, 1);
light.position.set(10, 15, 10);
scene.add(light);

// BODEN
const floorGeo = new THREE.PlaneGeometry(40, 40);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1;
scene.add(floor);

// GLASBEHÄLTER
const containerGroup = new THREE.Group();
scene.add(containerGroup);

const glassMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0.15,
  roughness: 0,
  metalness: 0,
  transmission: 1,
  side: THREE.DoubleSide
});

const edgeMaterial = new THREE.MeshStandardMaterial({
  color: 0x7dd3fc,
  emissive: 0x38bdf8,
  emissiveIntensity: 0.3
});

// Behälterkanten
const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(6, 8, 6)),
  new THREE.LineBasicMaterial({ color: 0x7dd3fc })
);
edges.position.y = 3;
containerGroup.add(edges);

// Transparente Wände
const container = new THREE.Mesh(
  new THREE.BoxGeometry(6, 8, 6),
  glassMaterial
);
container.position.y = 3;
containerGroup.add(container);

// Flüssigkeit
const liquidGeometry = new THREE.BoxGeometry(5.6, 4, 5.6);
const liquidMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x2563eb,
  transparent: true,
  opacity: 0.55,
  transmission: 0.3,
  roughness: 0.15
});

const liquid = new THREE.Mesh(liquidGeometry, liquidMaterial);
liquid.position.y = 1;
containerGroup.add(liquid);

// PARTIKEL
const particles = [];
const particleGeo = new THREE.SphereGeometry(0.13, 12, 12);

function createParticles(count) {

  particles.forEach(p => scene.remove(p));
  particles.length = 0;

  for(let i = 0; i < count; i++) {

    const mat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0x38bdf8,
      emissiveIntensity: 1
    });

    const particle = new THREE.Mesh(particleGeo, mat);

    particle.position.set(
      (Math.random() - 0.5) * 5,
      Math.random() * 7,
      (Math.random() - 0.5) * 5
    );

    particle.velocity = {
      x: (Math.random() - 0.5) * 0.03,
      y: (Math.random() - 0.5) * 0.03,
      z: (Math.random() - 0.5) * 0.03
    };

    particles.push(particle);
    scene.add(particle);
  }
}

createParticles(50);

// UI
const slider = document.getElementById('massSlider');
const volumeSlider = document.getElementById('volumeSlider');

const massText = document.getElementById('mass');
const densityText = document.getElementById('density');
const volumeText = document.getElementById('volume');

let currentMass = 50;
let currentVolume = 100;

function updateSimulation() {

  const density = currentMass / currentVolume;

  massText.textContent = currentMass;
  volumeText.textContent = currentVolume;
  densityText.textContent = density.toFixed(2);

  // Flüssigkeitshöhe anpassen
  // Flüssigkeitshöhe begrenzen damit sie nicht verschwindet
  const liquidHeight = Math.min(currentVolume / 100, 1.95);

  liquid.scale.y = liquidHeight;
  liquid.position.y = liquidHeight * 2 - 1;

  // Teilchenanzahl anpassen
  createParticles(currentMass);
}

slider.addEventListener('input', () => {
  currentMass = Number(slider.value);
  updateSimulation();
});

volumeSlider.addEventListener('input', () => {
  currentVolume = Number(volumeSlider.value);
  updateSimulation();
});

updateSimulation();

// MAUSSTEUERUNG
let targetRotationY = 0;
let targetRotationX = 0;
let currentRotationY = 0;
let currentRotationX = 0;
let isMouseDown = false;
let previousMouseX = 0;
let previousMouseY = 0;

renderer.domElement.addEventListener('mousedown', (event) => {
  isMouseDown = true;
  previousMouseX = event.clientX;
  previousMouseY = event.clientY;
});

renderer.domElement.addEventListener('mouseup', () => {
  isMouseDown = false;
});

renderer.domElement.addEventListener('mouseleave', () => {
  isMouseDown = false;
});

renderer.domElement.addEventListener('mousemove', (event) => {

  if (!isMouseDown) return;

  const deltaX = event.clientX - previousMouseX;
  const deltaY = event.clientY - previousMouseY;

  targetRotationY += deltaX * 0.01;
  targetRotationX += deltaY * 0.005;

  previousMouseX = event.clientX;
  previousMouseY = event.clientY;
});

// ANIMATION
function animate() {

  requestAnimationFrame(animate);

  camera.lookAt(container.position);

  // Sanfte Mausrotation
  currentRotationY += (targetRotationY - currentRotationY) * 0.08;
  currentRotationX += (targetRotationX - currentRotationX) * 0.08;

  containerGroup.rotation.y = currentRotationY;
  containerGroup.rotation.x = currentRotationX;

  // Flüssigkeitsbewegung
  liquid.rotation.z = Math.sin(Date.now() * 0.001) * 0.01;
  liquid.rotation.x = Math.cos(Date.now() * 0.0012) * 0.01;

  particles.forEach(p => {

    p.position.x += p.velocity.x;
    p.position.y += p.velocity.y;
    p.position.z += p.velocity.z;

    if(p.position.x > 2.7 || p.position.x < -2.7) p.velocity.x *= -1;
    if(p.position.y > 6.8 || p.position.y < -0.5) p.velocity.y *= -1;
    if(p.position.z > 2.7 || p.position.z < -2.7) p.velocity.z *= -1;
  });

  renderer.render(scene, camera);
}

animate();

// RESPONSIVE
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
