<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Dichte Simulation</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    #panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      width: 300px;
      padding: 20px;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }

    h1 {
      margin-top: 0;
      color: #38bdf8;
    }

    .formula {
      font-size: 28px;
      text-align: center;
      margin: 20px 0;
      color: #7dd3fc;
      font-weight: bold;
    }

    input[type=range] {
      width: 100%;
    }

    .values {
      margin-top: 15px;
      line-height: 1.8;
      font-size: 18px;
    }
  </style>
</head>
<body>

<div id="panel">
  <h1>Dichteberechnung</h1>

  <div class="formula">
    ρ = m / V
  </div>

  <label>Masse verändern</label>
  <input type="range" id="massSlider" min="10" max="150" value="50">

  <label style="margin-top:15px; display:block;">Volumen verändern</label>
  <input type="range" id="volumeSlider" min="50" max="200" value="100">

  <div class="values">
    <div>Masse: <span id="mass">50</span> g</div>
    <div>Volumen: <span id="volume">100</span> ml</div>
    <div>Dichte: <span id="density">0.50</span> g/ml</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f172a);

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.z = 14;
camera.position.y = 5;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// LICHT
const ambient = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambient);

const light = new THREE.PointLight(0xffffff, 1);
light.position.set(10, 15, 10);
scene.add(light);

// BODEN
const floorGeo = new THREE.PlaneGeometry(40, 40);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1;
scene.add(floor);

// GLASBEHÄLTER
const containerGroup = new THREE.Group();
scene.add(containerGroup);

const glassMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0.15,
  roughness: 0,
  metalness: 0,
  transmission: 1,
  side: THREE.DoubleSide
});

const boxSize = { x: 6, y: 8, z: 6 };

const container = new THREE.Mesh(
  new THREE.BoxGeometry(boxSize.x, boxSize.y, boxSize.z),
  glassMaterial
);
container.position.y = 3;
containerGroup.add(container);

// FLÜSSIGKEIT
const liquid = new THREE.Mesh(
  new THREE.BoxGeometry(5.6, 4, 5.6),
  new THREE.MeshPhysicalMaterial({
    color: 0x2563eb,
    transparent: true,
    opacity: 0.55
  })
);
liquid.position.y = 1;
containerGroup.add(liquid);

// PARTIKEL
const particles = [];
const particleGeo = new THREE.SphereGeometry(0.13, 12, 12);

function createParticles(count) {
  particles.forEach(p => scene.remove(p));
  particles.length = 0;

  for (let i = 0; i < count; i++) {
    const mat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0x38bdf8,
      emissiveIntensity: 1
    });

    const particle = new THREE.Mesh(particleGeo, mat);

    particle.position.set(
      (Math.random() - 0.5) * 5,
      Math.random() * 6,
      (Math.random() - 0.5) * 5
    );

    particle.velocity = {
      x: (Math.random() - 0.5) * 0.03,
      y: (Math.random() - 0.5) * 0.03,
      z: (Math.random() - 0.5) * 0.03
    };

    particles.push(particle);
    scene.add(particle);
  }
}

createParticles(50);

// UI
const massSlider = document.getElementById('massSlider');
const volumeSlider = document.getElementById('volumeSlider');
const massText = document.getElementById('mass');
const volumeText = document.getElementById('volume');
const densityText = document.getElementById('density');

let mass = 50;
let volume = 100;

function update() {
  const density = mass / volume;

  massText.textContent = mass;
  volumeText.textContent = volume;
  densityText.textContent = density.toFixed(2);

  createParticles(mass);

  const h = Math.min(volume / 100, 1.95);
  liquid.scale.y = h;
  liquid.position.y = h * 2 - 1;
}

massSlider.oninput = () => { mass = +massSlider.value; update(); };
volumeSlider.oninput = () => { volume = +volumeSlider.value; update(); };
update();

// MAUSSTEUERUNG
let down = false, ox = 0, oy = 0, tx = 0, ty = 0, rx = 0, ry = 0;

renderer.domElement.onmousedown = e => { down = true; ox = e.clientX; oy = e.clientY; };
renderer.domElement.onmouseup = () => down = false;
renderer.domElement.onmouseleave = () => down = false;
renderer.domElement.onmousemove = e => {
  if (!down) return;
  tx += (e.clientX - ox) * 0.01;
  ty += (e.clientY - oy) * 0.005;
  ox = e.clientX; oy = e.clientY;
};

function animate() {
  requestAnimationFrame(animate);

  rx += (tx - rx) * 0.08;
  ry += (ty - ry) * 0.08;

  containerGroup.rotation.y = rx;
  containerGroup.rotation.x = ry;

  containerGroup.updateMatrixWorld(true);

  const inv = new THREE.Matrix4().copy(containerGroup.matrixWorld).invert();
  const half = { x: boxSize.x / 2, y: boxSize.y / 2, z: boxSize.z / 2 };

  particles.forEach(p => {
    p.position.add(p.velocity);

    const local = p.position.clone().applyMatrix4(inv);

    if (local.x > half.x || local.x < -half.x) p.velocity.x *= -1;
    if (local.y > half.y || local.y < -half.y) p.velocity.y *= -1;
    if (local.z > half.z || local.z < -half.z) p.velocity.z *= -1;
  });

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
